name: Build Orbital Strike Cannon

"on":
push:
branches:
- main
- master
workflow_dispatch:

permissions:
contents: read

jobs:
build:
runs-on: ubuntu-latest
steps:
- name: Checkout source
uses: actions/checkout@v4

  - name: Set up Java 21
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '21'
      cache: maven

  - name: Build plugin
    run: mvn clean package

  - name: Upload JAR
    uses: actions/upload-artifact@v4
    with:
      name: OrbitalStrikeCannon
      path: '**/target/*.jar'
      if-no-files-found: error
